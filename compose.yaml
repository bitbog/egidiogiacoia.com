name: egidiogiacoia

services:
  site:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      DOCKER_POLLING: "true"
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
      - type: bind
        source: ./public
        target: /app/public
        read_only: true
      - type: bind
        source: ./astro.config.mjs
        target: /app/astro.config.mjs
        read_only: true
      - type: bind
        source: ./tsconfig.json
        target: /app/tsconfig.json
        read_only: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
